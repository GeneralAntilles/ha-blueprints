---
blueprint:
  name: Smart Battery Warning System
  description: Daily battery maintenance list. One stable notification per priority, automatically cleared after
    recovery. Supports device/area/entity exclusions and an Awaiting setup label. Battery Notes can be installed
    alongside for battery type and replacement history.
  domain: automation
  input:
    critical_threshold:
      name: Critical Battery Level
      description: Battery level that requires immediate attention
      default: 10
      selector:
        number:
          min: 1
          max: 20
          unit_of_measurement: '%'
          step: 1
    warning_threshold:
      name: Warning Battery Level
      description: Battery level that should be addressed soon
      default: 20
      selector:
        number:
          min: 10
          max: 50
          unit_of_measurement: '%'
          step: 5
    check_time:
      name: Daily Check Time
      description: When to run the daily battery check
      default: 09:00:00
      selector:
        time: {}
    excluded_entities:
      name: Excluded Entities
      description: Battery sensors to exclude from monitoring
      default:
        entity_id: []
      selector:
        target:
          entity:
            - device_class: battery
    exclude_charging:
      name: Exclude Charging Devices
      description: Skip devices that are currently charging
      default: true
      selector:
        boolean: {}
    excluded_label:
      name: Excluded inventory label
      description: Entities or devices with this label are kept in inventory but excluded from alerts.
      default: awaiting_setup
      selector:
        text: {}
variables:
  critical_threshold: !input 'critical_threshold'
  warning_threshold: !input 'warning_threshold'
  excluded_entities: !input 'excluded_entities'
  exclude_charging: !input 'exclude_charging'
  excluded_label: !input 'excluded_label'
  ignored_ids: |-
    {% set ns = namespace(ids=excluded_entities.get('entity_id', []) | list) %}
    {% for d in excluded_entities.get('device_id', []) + label_devices(excluded_label) %}
      {% set ns.ids = ns.ids + device_entities(d) %}
    {% endfor %}
    {% for a in excluded_entities.get('area_id', []) %}
      {% set ns.ids = ns.ids + area_entities(a) %}
    {% endfor %}
    {{ (ns.ids + label_entities(excluded_label) + integration_entities('battery_notes')) | unique | list }}
  all_battery_sensors: |-
    {% set ns = namespace(sensors=[]) %}
    {% for s in states.sensor | selectattr('attributes.device_class', 'defined') | selectattr('attributes.device_class', 'eq', 'battery') %}
      {% if s.entity_id not in ignored_ids and is_number(s.state) and s.attributes.get('unit_of_measurement') == '%' %}
        {% set level = s.state | float %}
        {% set charging = namespace(value=s.attributes.get('is_charging', false) | bool(false)) %}
        {% for e in device_entities(device_id(s.entity_id)) if device_id(s.entity_id) %}
          {% if (e.endswith('_battery_state') and states(e) | lower in ['charging', 'full']) or (e.endswith('_is_charging') and is_state(e, 'on')) %}
            {% set charging.value = true %}
          {% endif %}
        {% endfor %}
        {% if 0 <= level <= 100 and not (exclude_charging and charging.value) %}
          {% set note = namespace(battery_type='') %}
          {% for e in device_entities(device_id(s.entity_id)) if device_id(s.entity_id) %}
            {% if e.endswith('_battery_type') and has_value(e) %}{% set note.battery_type = states(e) %}{% endif %}
          {% endfor %}
          {% set ns.sensors = ns.sensors + [{'entity_id':s.entity_id, 'name':(device_attr(device_id(s.entity_id), 'name_by_user') or s.name) if s.name == 'Battery Level' else s.name, 'level':level, 'unit':'%', 'battery_type':note.battery_type}] %}
        {% endif %}
      {% endif %}
    {% endfor %}
    {{ ns.sensors }}
  critical_batteries: |
    {% set batteries = all_battery_sensors %} {{ batteries | selectattr('level', '<', critical_threshold) | list }}
  warning_batteries: |
    {% set batteries = all_battery_sensors %} {{ batteries | selectattr('level', '>=', critical_threshold)
                  | selectattr('level', '<', warning_threshold) | list }}
  critical_list: |-
    {% for battery in critical_batteries | sort(attribute="level") -%}
    - {{ battery.name }}: {{ battery.level | round(0) | int }}%{% if battery.battery_type %} — {{ battery.battery_type }}{% endif %}
    {% endfor %}
  warning_list: |-
    {% for battery in warning_batteries | sort(attribute="level") -%}
    - {{ battery.name }}: {{ battery.level | round(0) | int }}%{% if battery.battery_type %} — {{ battery.battery_type }}{% endif %}
    {% endfor %}
  critical_count: |
    {{ (critical_batteries) | length }}
  warning_count: |
    {{ (warning_batteries) | length }}
trigger:
  - platform: time
    at: !input 'check_time'
  - platform: homeassistant
    event: start
  - platform: event
    event_type: automation_reloaded
  - platform: event
    event_type: battery_notes_battery_threshold
  - platform: event
    event_type: battery_notes_battery_replaced
  - platform: event
    event_type: battery_notes_battery_increased
  - platform: event
    event_type: device_registry_updated
  - platform: event
    event_type: entity_registry_updated
action:
  - if:
      - condition: template
        value_template: '{{ critical_count | int > 0 }}'
    then:
      - action: persistent_notification.create
        data:
          notification_id: '{{ this.entity_id ~ "_critical" }}'
          title: 'Critical: {{ critical_count }} low batteries'
          message: |-
            {{ critical_list }}

            Label a stored device “Awaiting setup” to exclude it while preserving its inventory record. Battery types and replacement history are available in Battery Notes.
    else:
      - action: persistent_notification.dismiss
        data:
          notification_id: '{{ this.entity_id ~ "_critical" }}'
  - if:
      - condition: template
        value_template: '{{ warning_count | int > 0 }}'
    then:
      - action: persistent_notification.create
        data:
          notification_id: '{{ this.entity_id ~ "_warning" }}'
          title: 'Warning: {{ warning_count }} low batteries'
          message: |-
            {{ warning_list }}

            Label a stored device “Awaiting setup” to exclude it while preserving its inventory record. Battery types and replacement history are available in Battery Notes.
    else:
      - action: persistent_notification.dismiss
        data:
          notification_id: '{{ this.entity_id ~ "_warning" }}'
mode: single
max_exceeded: silent
