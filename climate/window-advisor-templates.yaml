# Window advisor (2026-09-27). Reference copy of the block appended to
# /Volumes/config/templates.yaml -- edit here, then re-sync that block.
# Plan + review notes: ~/.claude/plans/comfort-window-advisor.md
#
#   sensor.window_forecast          next 12 hours (NBM, met.no fallback) with dew point
#   sensor.window_advice            "Good" | blocking reason | "Blind: ..."
#   sensor.window_advice_trace      the whole ladder, for the Logic tab
#   binary_sensor.window_weather_good   debounced Good (20 min on / 10 min off)
#   binary_sensor.window_hazard     immediate: rain now, gusts, smoke/dust
#
# window_advice switches from "enter" to "stay" thresholds once
# window_weather_good is on (hysteresis), so open/close advice doesn't flap.

# Hourly forecast, refreshed every 30 min. Primary source is NOAA's
# National Blend of Models via Open-Meteo (rest_command.window_forecast_nbm,
# defined in configuration.yaml; reference copy in window-forecast-nbm.yaml):
# station-calibrated, and on 2026-10-08 it matched the backyard station within
# 0.6 degrees where met.no was 10 degrees low. met.no is the fallback
# (parsed only when NBM gave < 3 hours). Every hour's precip is the total
# for the hour that STARTS at t (met.no's convention; NBM's is shifted). On a
# failed fetch from both, the previous hours and fetched_at are kept;
# window_advice goes Blind once they are older than 90 min, so a dead
# forecast never reads as "dry".
- trigger:
    - trigger: time_pattern
      minutes: /30
    - trigger: homeassistant
      event: start
    - trigger: event
      event_type: event_template_reloaded
    - trigger: state
      entity_id: weather.forecast_home
      from: unavailable
  action:
    - action: rest_command.window_forecast_nbm
      response_variable: nbm
      continue_on_error: true
    - action: weather.get_forecasts
      target:
        entity_id: weather.forecast_home
      data:
        type: hourly
      response_variable: fc
      continue_on_error: true
    # Parsed once here so the state, hours and source can't disagree.
    - variables:
        nbm_hours: >-
          {% set ns = namespace(out=[]) %}
          {% set n = nbm.content.hourly if nbm is defined and nbm is mapping
               and nbm.get('status') == 200 and nbm.content is mapping
               and nbm.content.hourly is mapping else none %}
          {% if n is not none and n.time is list and n.temperature_2m is list
             and n.dew_point_2m is list %}
            {% for ts in n.time[:12] %}
              {% set i = loop.index0 %}
              {% set t = n.temperature_2m[i] if i < n.temperature_2m | length else none %}
              {% set d = n.dew_point_2m[i] if i < n.dew_point_2m | length else none %}
              {#- NBM precip at hour i+1 is the total for hour i..i+1. -#}
              {% set p = n.precipitation[i + 1] if n.precipitation is list
                   and i + 1 < n.precipitation | length else none %}
              {% if ts is number and t is number and d is number %}
                {% set ns.out = ns.out + [{
                     't': as_datetime(ts).isoformat(),
                     'temp': t | round(1), 'dp': d | round(1),
                     'precip': p if p is number else none }] %}
              {% endif %}
            {% endfor %}
          {% endif %}
          {{ ns.out }}
        met_hours: >-
          {% set ns = namespace(out=[]) %}
          {% set m = fc.get('weather.forecast_home') if fc is defined
               and fc is mapping else none %}
          {% if nbm_hours | length < 3 and m is mapping and m.get('forecast') is list %}
            {% for h in m.forecast[:12]
               if h is mapping and h.get('datetime') is string
               and h.get('temperature') is number and h.get('humidity') is number
               and h.humidity > 0 %}
              {% set tc = (h.temperature - 32) * 5 / 9 %}
              {% set g = log(h.humidity / 100) + 17.27 * tc / (237.3 + tc) %}
              {% set ns.out = ns.out + [{
                   't': h.datetime,
                   'temp': h.temperature,
                   'dp': ((237.3 * g / (17.27 - g)) * 9 / 5 + 32) | round(1),
                   'precip': h.get('precipitation') }] %}
            {% endfor %}
          {% endif %}
          {{ ns.out }}
        src: >-
          {{ 'nbm' if nbm_hours | length >= 3
             else ('met.no' if met_hours | length >= 3 else none) }}
  sensor:
    - unique_id: window_forecast
      name: Window Forecast
      icon: mdi:weather-cloudy-clock
      state: >-
        {% set h = nbm_hours if src == 'nbm' else met_hours %}
        {{ h | length if src else this.state | int(0) }}
      attributes:
        source: "{{ src if src else this.attributes.get('source') }}"
        fetched_at: >-
          {{ now().isoformat() if src else this.attributes.get('fetched_at') }}
        hours: >-
          {% if src == 'nbm' %}{{ nbm_hours }}
          {% elif src == 'met.no' %}{{ met_hours }}
          {% else %}{{ this.attributes.get('hours', []) }}{% endif %}

- sensor:
    - unique_id: window_advice
      name: Window Advice
      icon: mdi:window-open-variant
      # The ladder lives in custom_templates/window_advisor.jinja (source:
      # climate/window_advisor.jinja) so the Logic tab's trace below shows the
      # exact same decision. Replay-checked against the previous inline
      # template: logic-view/replay-window-advisor.py (1500 cases, 0 diffs).
      state: >-
        {% from 'window_advisor.jinja' import window_advice %}
        {{ (window_advice() | from_json).state }}
      attributes:
        summary: >-
          {% macro f(e) %}{{ (states(e) | float | round(0) | int) if is_number(states(e)) else '?' }}{% endmacro %}
          Outside {{ f('sensor.outdoor_temperature') }}°F, dew point {{ f('sensor.outdoor_dewpoint') }}°F · inside {{ f('sensor.indoor_temperature') }}°F, dew point {{ f('sensor.indoor_dew_point') }}°F
        # First projected point (station reading + forecast trend) that
        # breaks the "stay open" thresholds; none = nothing in 12 hours.
        # Both read from the trace sensor's single full decide() render
        # (rendering it again here would double the cost per update).
        good_until: >-
          {% set d = state_attr('sensor.window_advice_trace', 'trace') %}
          {{ d.good_until if d is mapping else none }}
        # While blocked: first future hour that would pass every "open"
        # threshold and hold for 2 h after; none = not within 12 hours.
        opens_around: >-
          {% set d = state_attr('sensor.window_advice_trace', 'trace') %}
          {{ d.opens_around if d is mapping else none }}
        # Next 2 h hold the stay-open limits (none = unknown); the "open"
        # push requires it, since that push can also fire in stay mode.
        outlook_ok: >-
          {% set d = state_attr('sensor.window_advice_trace', 'trace') %}
          {{ d.outlook_ok if d is mapping else none }}
        forecast_through: >-
          {% set d = state_attr('sensor.window_advice_trace', 'trace') %}
          {{ d.forecast_through if d is mapping else none }}

    # Every gate of the ladder with its live value and both thresholds, for
    # the Logic tab (logic-view/logic-trace-card.js). Recorder-excluded by
    # the sensor.*_trace glob. State = key of the deciding gate.
    - unique_id: window_advice_trace
      name: Window Advice Trace
      icon: mdi:head-cog-outline
      state: >-
        {% from 'window_advisor.jinja' import window_advice %}
        {% set d = window_advice() | from_json %}
        {{ 'blind' if d.state.startswith('Blind') else ('good' if d.decided < 0 else d.gates[d.decided].k) }}
      attributes:
        trace: >-
          {% from 'window_advisor.jinja' import window_advice %}
          {{ window_advice() | from_json }}
        summary: "{{ state_attr('sensor.window_advice', 'summary') }}"
        source: "{{ state_attr('sensor.window_forecast', 'source') }}"
        hours: >-
          {% set hours = state_attr('sensor.window_forecast', 'hours') %}
          {{ (hours | selectattr('t', 'defined') | list)[:12] if hours is list else [] }}

- binary_sensor:
    - unique_id: window_weather_good
      name: Window Weather Good
      icon: mdi:window-open-variant
      state: "{{ is_state('sensor.window_advice', 'Good') }}"
      availability: >-
        {{ has_value('sensor.window_advice')
           and not states('sensor.window_advice').startswith('Blind') }}
      delay_on:
        minutes: 20
      delay_off:
        minutes: 10

    # Immediate "close the windows" conditions, no debounce. Each input
    # counts on its own: a dead PM sensor must not hide rain. Unavailable
    # only when all three are missing. The reason is a category (no
    # numbers) so it only changes when the kind of hazard changes.
    - unique_id: window_hazard
      name: Window Hazard
      icon: mdi:weather-lightning-rainy
      state: >-
        {% set rr = states('sensor.weather_station_rain_rate') %}
        {% set gust = states('sensor.weather_station_wind_gust') %}
        {% set pm = states('sensor.airgradient_outdoor_pm2_5') %}
        {{ (is_number(rr) and rr | float > 0)
           or (is_number(gust) and gust | float >= 25)
           or (is_number(pm) and pm | float > 35) }}
      availability: >-
        {{ is_number(states('sensor.weather_station_rain_rate'))
           or is_number(states('sensor.weather_station_wind_gust'))
           or is_number(states('sensor.airgradient_outdoor_pm2_5')) }}
      attributes:
        reason: >-
          {% set rr = states('sensor.weather_station_rain_rate') %}
          {% set gust = states('sensor.weather_station_wind_gust') %}
          {% set pm = states('sensor.airgradient_outdoor_pm2_5') %}
          {% if is_number(rr) and rr | float > 0 %}It's raining
          {%- elif is_number(gust) and gust | float >= 25 %}Strong wind gusts
          {%- elif is_number(pm) and pm | float > 35 %}Smoke or dust outside
          {%- else %}none{% endif %}

    # House too hot, too cold or too muggy for 15 min. Only acted on while
    # Windows Open is on, as the safety net for forgotten open windows.
    - unique_id: window_indoor_extreme
      name: Window Indoor Extreme
      icon: mdi:home-thermometer
      state: >-
        {% set it = states('sensor.indoor_temperature') | float(70) %}
        {% set idp = states('sensor.indoor_dew_point') | float(50) %}
        {{ it > 80 or it < 62 or idp > 62 }}
      availability: "{{ is_number(states('sensor.indoor_temperature')) }}"
      delay_on:
        minutes: 15
      attributes:
        reason: >-
          {% set it = states('sensor.indoor_temperature') | float(70) %}
          {% set idp = states('sensor.indoor_dew_point') | float(50) %}
          {% if it > 80 %}House is {{ it | round(0) | int }}°F
          {%- elif it < 62 %}House is down to {{ it | round(0) | int }}°F
          {%- elif idp > 62 %}Indoor dew point is {{ idp | round(0) | int }}°F
          {%- else %}none{% endif %}
