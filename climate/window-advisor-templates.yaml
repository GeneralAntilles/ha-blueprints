# Window advisor (2026-09-27; on the window-advisor.yaml blueprint since
# 2026-10-18). Reference copy of the block in /Volumes/config/templates.yaml
# -- edit here, then re-sync that block.
#
#   sensor.window_forecast          next 12 hours (NBM, met.no fallback) with dew point
#   sensor.window_advice_trace      the advisor (blueprint instance): state = advice,
#                                   attributes = debounce, hazard, extreme, trace
#   sensor.window_advice            compat: same state + the attributes the
#                                   dashboard and pushes used (recorded, keeps history)
#   binary_sensor.window_weather_good   compat: the advisor's debounced `good`
#                                   (Good or Crack them), unavailable while Blind
#
# The decision itself is climate/window_advisor.jinja, copied into the
# blueprint by climate/build-window-advisor.py.

# Hourly forecast, refreshed every 30 min. Primary source is NOAA's
# National Blend of Models via Open-Meteo (rest_command.window_forecast_nbm,
# defined in configuration.yaml; reference copy in window-forecast-nbm.yaml):
# station-calibrated, and on 2026-10-08 it matched the backyard station within
# 0.6 degrees where met.no was 10 degrees low. met.no is the fallback
# (parsed only when NBM gave < 3 hours). Every hour's precip is the total
# for the hour that STARTS at t (met.no's convention; NBM's is shifted). On a
# failed fetch from both, the previous hours and fetched_at are kept;
# window_advice goes Blind once they are older than 90 min, so a dead
# forecast never reads as "dry".
- trigger:
    - trigger: time_pattern
      minutes: /30
    - trigger: homeassistant
      event: start
    - trigger: event
      event_type: event_template_reloaded
    - trigger: state
      entity_id: weather.forecast_home
      from: unavailable
  action:
    - action: rest_command.window_forecast_nbm
      response_variable: nbm
      continue_on_error: true
    - action: weather.get_forecasts
      target:
        entity_id: weather.forecast_home
      data:
        type: hourly
      response_variable: fc
      continue_on_error: true
    # Parsed once here so the state, hours and source can't disagree.
    - variables:
        nbm_hours: >-
          {% set ns = namespace(out=[]) %}
          {% set n = nbm.content.hourly if nbm is defined and nbm is mapping
               and nbm.get('status') == 200 and nbm.content is mapping
               and nbm.content.hourly is mapping else none %}
          {% if n is not none and n.time is list and n.temperature_2m is list
             and n.dew_point_2m is list %}
            {% for ts in n.time[:12] %}
              {% set i = loop.index0 %}
              {% set t = n.temperature_2m[i] if i < n.temperature_2m | length else none %}
              {% set d = n.dew_point_2m[i] if i < n.dew_point_2m | length else none %}
              {#- NBM precip at hour i+1 is the total for hour i..i+1. -#}
              {% set p = n.precipitation[i + 1] if n.precipitation is list
                   and i + 1 < n.precipitation | length else none %}
              {% if ts is number and t is number and d is number %}
                {% set ns.out = ns.out + [{
                     't': as_datetime(ts).isoformat(),
                     'temp': t | round(1), 'dp': d | round(1),
                     'precip': p if p is number else none }] %}
              {% endif %}
            {% endfor %}
          {% endif %}
          {{ ns.out }}
        met_hours: >-
          {% set ns = namespace(out=[]) %}
          {% set m = fc.get('weather.forecast_home') if fc is defined
               and fc is mapping else none %}
          {% if nbm_hours | length < 3 and m is mapping and m.get('forecast') is list %}
            {% for h in m.forecast[:12]
               if h is mapping and h.get('datetime') is string
               and h.get('temperature') is number and h.get('humidity') is number
               and h.humidity > 0 %}
              {% set tc = (h.temperature - 32) * 5 / 9 %}
              {% set g = log(h.humidity / 100) + 17.27 * tc / (237.3 + tc) %}
              {% set ns.out = ns.out + [{
                   't': h.datetime,
                   'temp': h.temperature,
                   'dp': ((237.3 * g / (17.27 - g)) * 9 / 5 + 32) | round(1),
                   'precip': h.get('precipitation') }] %}
            {% endfor %}
          {% endif %}
          {{ ns.out }}
        src: >-
          {{ 'nbm' if nbm_hours | length >= 3
             else ('met.no' if met_hours | length >= 3 else none) }}
  sensor:
    - unique_id: window_forecast
      name: Window Forecast
      icon: mdi:weather-cloudy-clock
      state: >-
        {% set h = nbm_hours if src == 'nbm' else met_hours %}
        {{ h | length if src else this.state | int(0) }}
      attributes:
        source: "{{ src if src else this.attributes.get('source') }}"
        fetched_at: >-
          {{ now().isoformat() if src else this.attributes.get('fetched_at') }}
        hours: >-
          {% if src == 'nbm' %}{{ nbm_hours }}
          {% elif src == 'met.no' %}{{ met_hours }}
          {% else %}{{ this.attributes.get('hours', []) }}{% endif %}

# The advisor. unique_id is the old trace sensor's, so the entity keeps
# sensor.window_advice_trace (Logic card, *_trace recorder exclude).
- use_blueprint:
    path: GeneralAntilles/window-advisor.yaml
    input:
      instance_key: home
      windows_open: [input_boolean.windows_open]
      outdoor_temperature: sensor.outdoor_temperature
      outdoor_dew_point: sensor.outdoor_dewpoint
      indoor_temperature: sensor.indoor_temperature
      indoor_dew_point: sensor.indoor_dew_point
      indoor_humidity: sensor.indoor_humidity
      forecast_sensor: sensor.window_forecast
      rain_rate: [sensor.weather_station_rain_rate]
      rained_recently: [binary_sensor.rain_in_last_30_minutes]
      wind_gust: [sensor.weather_station_wind_gust]
      pm25: [sensor.airgradient_outdoor_pm2_5]
      thermostats: [climate.downstairs, climate.studio_upstairs_thermostat]
      thermostat_temperatures:
        - sensor.downstairs_current_temperature
        - sensor.studio_upstairs_thermostat_current_temperature
  unique_id: window_advice_trace
  name: Window Advice Trace

- sensor:
    # Recorded twin of the advisor's state (history, Home dashboard).
    - unique_id: window_advice
      name: Window Advice
      icon: mdi:window-open-variant
      state: "{{ states('sensor.window_advice_trace') }}"
      availability: "{{ has_value('sensor.window_advice_trace') }}"
      attributes:
        summary: "{{ state_attr('sensor.window_advice_trace', 'summary') }}"
        level: "{{ state_attr('sensor.window_advice_trace', 'level') }}"
        good_until: "{{ state_attr('sensor.window_advice_trace', 'good_until') }}"
        opens_around: "{{ state_attr('sensor.window_advice_trace', 'opens_around') }}"
        outlook_ok: "{{ state_attr('sensor.window_advice_trace', 'outlook_ok') }}"
        open_ok: "{{ state_attr('sensor.window_advice_trace', 'open_ok') }}"
        forecast_through: "{{ state_attr('sensor.window_advice_trace', 'forecast_through') }}"

- binary_sensor:
    # Dashboard visibility conditions. Already debounced by the advisor.
    - unique_id: window_weather_good
      name: Window Weather Good
      icon: mdi:window-open-variant
      state: "{{ state_attr('sensor.window_advice_trace', 'good') is true }}"
      availability: "{{ state_attr('sensor.window_advice_trace', 'good') is not none }}"
