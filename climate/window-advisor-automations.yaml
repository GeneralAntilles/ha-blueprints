# Window advisor notifications (2026-09-27; on the window-advisor-notify.yaml
# blueprint since 2026-10-18). Reference copy of the automation stored in
# /Volumes/config/automations.yaml (pushed via
# /api/config/automation/config/<id>). Templates: window-advisor-templates.yaml.
# The HVAC interlock (thermostats off while Windows Open is on) was removed
# 2026-10-10; Windows Open no longer touches the thermostats.
#
# input_text.window_advisor_stamps holds when each push was last sent (JSON;
# replaced the four input_datetime.window_*_last_sent helpers). Tags and
# button ids are prefixed with the instance key (default: this automation's
# id, climate_window_advisor).
- id: climate_window_advisor
  alias: 'Climate: Window Advisor'
  description: >-
    Open/close window pushes from sensor.window_advice_trace (window-advisor.yaml
    blueprint). Source: ha-blueprints/climate/.
  use_blueprint:
    path: GeneralAntilles/window-advisor-notify.yaml
    input:
      advisor: sensor.window_advice_trace
      windows_open: input_boolean.windows_open
      stamps: input_text.window_advisor_stamps
      notify:
        - notify.mobile_app_iphone_13_pro
      presence:
        - person.ryan_abel
      quiet_start: "22:00:00"
      quiet_end: "07:00:00"
      alarm:
        - alarm_control_panel.home
